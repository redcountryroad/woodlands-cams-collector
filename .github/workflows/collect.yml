name: Collect Cameras

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: collect-cameras
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout code repo
        uses: actions/checkout@v4

      - name: Checkout data repo
        uses: actions/checkout@v4
        with:
          repository: redcountryroad/woodlands-cams-data
          token: ${{ secrets.DATA_REPO_PAT }}
          path: data
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run collector
        run: python collector.py --once --output-dir ./data/images

      - name: Commit and push to data repo
        run: |
          cd data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No new images, skipping commit"
          else
            git commit -m "Cameras: $(date -u '+%Y-%m-%d %H:%M UTC')"
            git pull --rebase
            git push
          fi

      - name: Heartbeat (keep code repo cron alive)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          date -u '+%Y-%m-%d' > LAST_RUN.txt
          git add LAST_RUN.txt
          if git diff --cached --quiet; then
            echo "Heartbeat already up to date, skipping commit"
          else
            git commit -m "Heartbeat $(date -u '+%Y-%m-%d')"
            git pull --rebase
            git push
          fi
